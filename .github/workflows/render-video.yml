name: Render video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase video_jobs row ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out worker
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Set up Python for Kokoro TTS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-models-v1
      - name: Install Kokoro TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile
          mkdir -p ~/.cache/kokoro
          curl -L --fail --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o ~/.cache/kokoro/kokoro-v1.0.onnx
          curl -L --fail --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o ~/.cache/kokoro/voices-v1.0.bin
      - name: Render MP4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIDEO_JOB_ID: ${{ inputs.job_id }}
        run: npm run render
